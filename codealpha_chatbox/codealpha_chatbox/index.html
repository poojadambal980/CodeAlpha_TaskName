<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Box — Flashcard Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="Card Box Logo" class="logo">
    <p class="eyebrow">Card box</p>
    <h1>Study deck</h1>
    <p class="progress" id="progress"></p>
  </header>

  <div class="stage">
    <div class="card" id="card">
      <div class="empty" id="emptyMsg">No cards yet — add one below to start studying.</div>
    </div>
  </div>

  <div class="navrow">
    <button id="prevBtn">Previous</button>
    <button id="flipBtn" class="primary">Show answer</button>
    <button id="nextBtn">Next</button>
  </div>

  <button class="addtrigger" id="addTrigger">+ Add a card</button>
  <div class="addform" id="addForm">
    <div>
      <label for="qInput">Question</label>
      <textarea id="qInput" rows="2"></textarea>
    </div>
    <div>
      <label for="aInput">Answer</label>
      <textarea id="aInput" rows="2"></textarea>s
    </div>
    <div class="formrow">
      <button id="cancelForm">Cancel</button>
      <button id="saveForm" class="primary">Save card</button>
    </div>
  </div>

  <p class="section-title">All cards</p>
  <div class="list" id="list"></div>
</div>

<script src="script.js"></script>
</body>
</html>
